<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - My Marketplace</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f7f7;
            color: #222;
        }

        .orders-page {
            max-width: 1150px;
            margin: 0 auto;
            padding: 45px 22px 80px;
        }

        .orders-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .orders-heading h1 {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 38px;
            font-weight: 500;
            color: #171717;
        }

        .orders-heading p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 22px;
            border-bottom: 1px solid #eeeeee;
        }

        .order-id {
            font-size: 14px;
            font-weight: 700;
            color: #202020;
        }

        .order-date {
            margin-top: 6px;
            color: #999;
            font-size: 11px;
        }

        .order-status {
            padding: 8px 15px;
            border-radius: 30px;
            background: #eef7ef;
            color: #3e7046;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .order-body {
            padding: 22px;
        }

        .product-row {
            display: flex;
            align-items: center;
            gap: 17px;
        }

        .product-image {
            width: 85px;
            height: 95px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #f3f3f3;
            border: 1px solid #eeeeee;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-info h2 {
            margin: 0 0 7px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 19px;
            font-weight: 500;
            color: #222;
        }

        .product-info p {
            margin: 4px 0;
            color: #777;
            font-size: 12px;
        }

        .product-price {
            text-align: right;
            min-width: 110px;
        }

        .product-price .price {
            font-size: 18px;
            font-weight: 700;
            color: #171717;
        }

        .product-price .quantity {
            margin-top: 5px;
            color: #888;
            font-size: 11px;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }

        .detail-box {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            padding: 15px;
        }

        .detail-box h3 {
            margin: 0 0 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: #999;
        }

        .detail-box p {
            margin: 3px 0;
            color: #333;
            font-size: 12px;
            line-height: 1.5;
        }

        .order-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 17px 22px;
            background: #fafafa;
            border-top: 1px solid #eeeeee;
        }

        .tracking-strip {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 5px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eeeeee;
        }

        .tracking-step {
            color: #aaa;
            font-size: 10px;
            line-height: 1.25;
            text-align: center;
        }

        .tracking-step.active {
            color: #7b4d35;
            font-weight: 700;
        }

        .payment {
            color: #777;
            font-size: 12px;
        }

        .total-area {
            text-align: right;
        }

        .total-label {
            color: #888;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .total-price {
            color: #171717;
            font-size: 21px;
            font-weight: 700;
        }

        .empty-orders {
            min-height: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,.04);
            padding: 30px;
        }

        .empty-icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border-radius: 50%;
            background: #f4f4f4;
            font-size: 35px;
        }

        .empty-orders h2 {
            margin: 0 0 8px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 27px;
            font-weight: 500;
        }

        .empty-orders p {
            margin: 0 0 22px;
            color: #777;
            font-size: 13px;
        }

        .shop-button {
            height: 44px;
            padding: 0 25px;
            border: none;
            border-radius: 24px;
            background: #171717;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .shop-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .error-box {
            padding: 25px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 15px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 650px) {

            .orders-page {
                padding: 32px 14px 60px;
            }

            .orders-heading h1 {
                font-size: 30px;
            }

            .order-top {
                align-items: flex-start;
                padding: 17px;
            }

            .order-body {
                padding: 17px;
            }

            .product-row {
                align-items: flex-start;
            }

            .product-image {
                width: 68px;
                height: 78px;
            }

            .product-info h2 {
                font-size: 16px;
            }

            .product-price {
                min-width: auto;
            }

            .product-price .price {
                font-size: 15px;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-footer {
                padding: 15px 17px;
            }

            .total-price {
                font-size: 18px;
            }
        }

        @media (max-width: 430px) {

            .order-top {
                flex-direction: column;
                gap: 10px;
            }

            .product-row {
                gap: 11px;
            }

            .product-image {
                width: 62px;
                height: 72px;
            }

            .product-info p {
                font-size: 11px;
            }

            .product-price {
                min-width: 70px;
            }

            .order-footer {
                align-items: flex-end;
            }
        }
    </style>
    <script src="logo.js"></script>
</head>

<body>

<header class="top-header">

<div class="logo"
     onclick="window.location.href='index.html'">

    <div class="premium-brand">

        <img
            src="./lotus-logo.png"
            alt="My Marketplace"
            class="premium-lotus"
        >

        <div class="premium-brand-text">

            <div class="premium-name">

                <span class="premium-my">
                    My
                </span>

                <span class="premium-marketplace">
                    Marketplace
                </span>

            </div>

            <div class="premium-line"></div>

        </div>

    </div>

</div>

    <button class="cart-back-button"
            onclick="window.location.href='index.html'">
        ← Continue Shopping
    </button>

</header>


<main class="orders-page">

    <div class="orders-heading">

        <h1>My Orders</h1>

        <p>
            Track your orders and view complete order details.
        </p>

        <div id="customerNotifications" style="margin-top:12px;color:#7b4d35;font-size:12px"></div>

    </div>


    <div id="ordersContainer"
         class="orders-container">
    </div>

</main>

<script>

/* =========================================
   MY ORDERS
   SERVER + CUSTOMER ACCOUNT
========================================= */


/* =========================================
   GET LOGGED-IN CUSTOMER
========================================= */

function getLoggedInCustomer() {

    try {

        if (
            localStorage.getItem(
                "myMarketplaceAccountLoggedIn"
            ) !== "true"
        ) {

            return null;

        }

        const account =
            JSON.parse(
                localStorage.getItem(
                    "myMarketplaceAccount"
                )
            );

        return account || null;

    }
    catch (error) {

        return null;

    }

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateValue) {

    if (!dateValue) {

        return "Order date unavailable";

    }


    const date =
        new Date(dateValue);


    if (isNaN(date.getTime())) {

        return String(dateValue);

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================
   PAYMENT LABEL
========================================= */

function paymentText(method) {

    if (method === "UPI QR Payment") {
        return "UPI QR Payment";
    }

    if (
        method === "cod" ||
        method === "Cash on Delivery"
    ) {

        return "Cash on Delivery";

    }


    return "Online Payment";

}


function formatPrice(value) {

    const amount =
        Number(value);

    return Number.isFinite(amount)
        ? amount.toLocaleString("en-IN")
        : "0";

}


/* =========================================
   NORMALIZE ORDER
   SUPPORT OLD + NEW FORMAT
========================================= */

function normalizeOrder(order) {

    if (!order) {

        return null;

    }


    const product =
        order.product || {};


    const customer =
        order.customer || {};


    const customization =
        order.customization || {};


    /* =====================================
       PRODUCT NAME
    ===================================== */

    const productName =
        product.name ||
        order.productName ||
        "Product";


    /* =====================================
       PRODUCT PRICE
    ===================================== */

    let productPrice =
        Number(
            product.price
        );


    if (
        !Number.isFinite(
            productPrice
        ) ||
        productPrice <= 0
    ) {

        productPrice =
            Number(
                order.productPrice
            );

    }


    if (
        !Number.isFinite(
            productPrice
        )
    ) {

        productPrice = 0;

    }


    /* =====================================
       QUANTITY
    ===================================== */

    let quantity =
        Number(
            product.quantity
        );


    if (
        !Number.isFinite(quantity) ||
        quantity <= 0
    ) {

        quantity = 1;

    }


    /* =====================================
       TOTAL
    ===================================== */

    let total =
        Number(
            order.total
        );


    if (
        !Number.isFinite(total) ||
        total <= 0
    ) {

        total =
            productPrice *
            quantity;

    }


    /* =====================================
       IMAGE
    ===================================== */

    const image =
        product.image ||
        order.image ||
        "product.jpg";


    /* =====================================
       CUSTOMER NAME
    ===================================== */

    const customerName =
        customer.name ||
        order.name ||
        "Customer";


    /* =====================================
       CUSTOMER PHONE
    ===================================== */

    const customerPhone =
        customer.phone ||
        order.mobile ||
        "";


    /* =====================================
       CUSTOMER EMAIL
    ===================================== */

    const customerEmail =
        customer.email ||
        order.email ||
        "";


    /* =====================================
       ADDRESS
    ===================================== */

    const address =
        customer.address ||
        order.address ||
        "";


    const city =
        customer.city ||
        order.city ||
        "";


    const state =
        customer.state ||
        order.state ||
        "";


    const pincode =
        customer.pincode ||
        order.pincode ||
        "";


    const landmark =
        customer.landmark ||
        order.landmark ||
        "";


    /* =====================================
       ORDER ID
    ===================================== */

    const orderId =
        order.orderId ||
        (
            order.id
                ? "MM" + order.id
                : "Order ID unavailable"
        );


    /* =====================================
       DATE
    ===================================== */

    const date =
        order.date ||
        order.createdAt ||
        "";


    /* =====================================
       SIZE
    ===================================== */

    const size =
        customization.size ||
        order.measurements ||
        "Not specified";


    /* =====================================
       DELIVERY
    ===================================== */

    const delivery =
        customization.delivery ||
        "Standard Delivery";


    /* =====================================
       INSTRUCTIONS
    ===================================== */

    const instructions =
        customization.instructions ||
        "No special instructions";


    /* =====================================
       PAYMENT
    ===================================== */

    const payment =
        paymentText(
            order.paymentMethod ||
            order.payment
        );

    const orderStatus =
        order.orderStatus || "Order Placed";

    const paymentStatus =
        order.paymentStatus || (payment === "UPI QR Payment" ? "Pending Verification" : "Pending");


    return {

        orderId: orderId,

        date: date,

        customerName: customerName,

        customerPhone: customerPhone,

        customerEmail: customerEmail,

        address: address,

        city: city,

        state: state,

        pincode: pincode,

        landmark: landmark,

        productName: productName,

        productPrice: productPrice,

        quantity: quantity,

        total: total,

        image: image,

        size: size,

        delivery: delivery,

        instructions: instructions,

        payment: payment,

        paymentStatus: paymentStatus,

        orderStatus: orderStatus

    };

}


/* =========================================
   LOAD ORDERS FROM SERVER
========================================= */

async function getOrders() {

    try {
        const account = getLoggedInCustomer();
        if (account && account.phone) {
            const response = await fetch("/customer-orders?phone=" + encodeURIComponent(account.phone));
            if (response.ok) {
                const data = await response.json();
                return Array.isArray(data) ? data : [];
            }
        }

        const lastOrderPhone = String(localStorage.getItem("myMarketplaceLastOrderPhone") || "").trim();
        if (!lastOrderPhone || localStorage.getItem("myMarketplaceAccountLoggedIn") === "false") {
            return [];
        }

        const rawOrders = localStorage.getItem("orders");
        const data = rawOrders ? JSON.parse(rawOrders) : [];
        return Array.isArray(data) ? data : [];

    }
    catch (error) {

        return [];

    }

}

async function loadCustomerNotifications() {
    const account = getLoggedInCustomer();
    if (!account || !account.phone) return;
    const response = await fetch("/notifications?audience=" + encodeURIComponent("customer:" + account.phone));
    if (!response.ok) return;
    const notifications = await response.json();
    const container = document.getElementById("customerNotifications");
    if (container && notifications.length) {
        container.textContent = notifications.slice(0, 3).map(item => item.message).join(" | ");
    }
}


/* =========================================
   RENDER ORDERS
========================================= */

async function renderOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    if (!container) {

        return;

    }


    container.innerHTML = `

        <div class="error-box">

            Loading your orders...

        </div>

    `;


    const allOrders =
        await getOrders();


    /* =====================================
       LOGGED-IN CUSTOMER
    ===================================== */

    const account =
        getLoggedInCustomer();


    let customerOrders = [];


    /*
     * If customer is logged in,
     * show only that customer's orders.
     */

    if (
        account &&
        account.phone
    ) {

        customerOrders =
            allOrders.filter(
                function(order) {

                    const orderPhone =
                        String(
                            order.mobile ||
                            (
                                order.customer &&
                                order.customer.phone
                            ) ||
                            ""
                        ).trim();


                    return (
                        orderPhone ===
                        String(
                            account.phone
                        ).trim()
                    );

                }
            );

    }

    else {

        const loginState = localStorage.getItem("myMarketplaceAccountLoggedIn");
        const lastOrderPhone = String(
            localStorage.getItem("myMarketplaceLastOrderPhone") || ""
        ).trim();

        if (loginState !== "false" && lastOrderPhone) {
            customerOrders = allOrders.filter(function(order) {
                return String(
                    order.mobile ||
                    (order.customer && order.customer.phone) ||
                    ""
                ).trim() === lastOrderPhone;
            });
        }

    }


    /* =====================================
       NORMALIZE
    ===================================== */

    const normalizedOrders =
        customerOrders
            .map(
                normalizeOrder
            )
            .filter(
                Boolean
            );


    /* =====================================
       NO ORDERS
    ===================================== */

    if (
        normalizedOrders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    Your successfully placed orders will appear here.
                </p>

                <button
                    class="shop-button"
                    onclick="window.location.href='index.html'">

                    Explore Products

                </button>

            </div>

        `;

        return;

    }


    /* =====================================
       CLEAR CONTAINER
    ===================================== */

    container.innerHTML = "";


    /* =====================================
       NEWEST FIRST
    ===================================== */

    normalizedOrders
        .slice()
        .reverse()
        .forEach(
            function(order) {

                const addressParts = [

                    order.address,

                    order.city,

                    order.state,

                    order.pincode

                ]
                .filter(
                    Boolean
                );


                const fullAddress =
                    addressParts.join(
                        ", "
                    );


                const landmarkHTML =
                    order.landmark
                        ? `
                            <p>
                                Landmark:
                                ${order.landmark}
                            </p>
                          `
                        : "";


                const emailHTML =
                    order.customerEmail
                        ? `
                            <p>
                                ${order.customerEmail}
                            </p>
                          `
                        : "";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-top">

                        <div>

                            <div class="order-id">

                                Order ID:
                                ${order.orderId}

                            </div>

                            <div class="order-date">

                                ${formatDate(
                                    order.date
                                )}

                            </div>

                        </div>


                        <div class="order-status">
                            ${order.orderStatus}
                        </div>

                    </div>


                    <div class="order-body">

                        <div class="product-row">

                            <div class="product-image">

                                <img
                                    src="${order.image}"
                                    alt="${order.productName}"
                                    onerror="this.src='product.jpg'"
                                >

                            </div>


                            <div class="product-info">

                                <h2>

                                    ${order.productName}

                                </h2>


                                <p>
                                    ₹${formatPrice(order.productPrice)} per item
                                </p>

                                <p>
                                    ${order.payment} (${order.paymentStatus})
                                </p>
                                <p>

                                    Quantity:
                                    ${order.quantity}

                                </p>

                            </div>


                            <div class="product-price">

                                <div class="price">

                                    ₹${formatPrice(
                                        order.total
                                    )}

                                </div>


                                <div class="quantity">

                                    ${order.quantity}
                                    item${order.quantity > 1 ? "s" : ""}

                                </div>

                            </div>

                        </div>

                        <div class="tracking-strip">
                            ${[
                                "Order Placed", "Confirmed", "Packed",
                                "Shipped", "Out for Delivery", "Delivered"
                            ].map(function (status) {
                                const statusOrder = ["Order Placed", "Confirmed", "Packed", "Shipped", "Out for Delivery", "Delivered"];
                                const currentIndex = statusOrder.indexOf(order.orderStatus);
                                const stepIndex = statusOrder.indexOf(status);
                                const active = currentIndex >= 0 && stepIndex <= currentIndex;
                                return `<div class="tracking-step${active ? " active" : ""}">${status}</div>`;
                            }).join("")}
                        </div>

                        <div class="order-details">


                            <div class="detail-box">

                                <h3>

                                    Delivery Address

                                </h3>


                                <p>

                                    ${order.customerName}

                                </p>


                                ${
                                    order.customerPhone
                                        ? `
                                            <p>
                                                ${order.customerPhone}
                                            </p>
                                          `
                                        : ""
                                }


                                ${emailHTML}


                                <p>

                                    ${
                                        fullAddress ||
                                        "Address not available"
                                    }

                                </p>


                                ${landmarkHTML}

                            </div>


                            <div class="detail-box">

                                <h3>

                                    Customization

                                </h3>


                                <p>

                                    Size:
                                    ${order.size}

                                </p>


                                <p>

                                    Delivery:
                                    ${order.delivery}

                                </p>


                                <p>

                                    ${order.instructions}

                                </p>

                            </div>


                        </div>

                    </div>


                    <div class="order-footer">


                        <div class="payment">

                            Payment:
                            <strong>

                                ${order.payment}

                            </strong>

                        </div>


                        <div class="total-area">

                            <div class="total-label">

                                Order Total

                            </div>


                            <div class="total-price">

                                ₹${formatPrice(
                                    order.total
                                )}

                            </div>

                        </div>


                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

}


/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderOrders();
        loadCustomerNotifications();

    }
);

</script>

</body>
</html>
